name: mygallery
description: "オフライン用の画像ギャラリーアプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  file_picker: ^10.1.7
  docman: ^1.2.0
  image: ^4.5.4
  path_provider: ^2.1.5
  flutter_riverpod: ^2.6.1
  flutter_cache_manager: ^3.4.1
  photo_view: ^0.15.0
  path: ^1.9.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_icons:
    android: true
    windows:
      generate: true
    image_path: "assets/icon/icon.png"